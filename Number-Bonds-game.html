<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒互動學習遊戲</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* 觸控與互動最佳化 */
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Traditional Chinese", sans-serif;
      background-color: #F3F4F6;
    }
    .draggable {
      cursor: grab;
    }
    .draggable:active {
      cursor: grabbing;
    }
    .dropzone-highlight {
      border-color: #3B82F6 !important;
      background-color: #EFF6FF !important;
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-bounce-short {
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- 頂部導覽列 -->
  <header class="bg-amber-400 p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
    <button id="btn-home" onclick="showMainMenu()" class="hidden bg-white text-amber-700 font-bold py-2 px-6 rounded-full text-xl shadow hover:bg-amber-100 transition active:scale-95">
      🏠 首頁
    </button>
    <h1 id="app-title" class="text-2xl sm:text-3xl font-extrabold text-amber-900 mx-auto">
      🌟 幼兒趣味學習樂園 🌟
    </h1>
    <div class="w-20 hidden sm:block"></div>
  </header>

  <!-- 主內容容器 -->
  <main class="container mx-auto px-4 py-6 flex-grow flex flex-col justify-center items-center">
    
    <!-- 1. 首頁選單 -->
    <div id="view-menu" class="w-full max-w-4xl">
      <h2 class="text-2xl sm:text-3xl font-bold text-center text-slate-700 mb-8">請選擇關卡！</h2>
      <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <!-- 關卡卡片由 JS 動態生成 -->
      </div>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="view-game" class="hidden w-full max-w-3xl flex flex-col items-center">
      <!-- 關卡標題與進度 -->
      <div class="w-full flex justify-between items-center mb-6">
        <span id="game-title" class="text-xl sm:text-2xl font-bold text-amber-700"></span>
        <span id="game-progress" class="text-lg font-bold bg-amber-200 text-amber-900 px-4 py-1 rounded-full"></span>
      </div>

      <!-- 題目顯示區 -->
      <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl w-full text-center border-4 border-amber-300 mb-8">
        <h3 id="question-text" class="text-3xl sm:text-5xl font-black text-slate-800 tracking-wide mb-6">
          <!-- 題目內容 -->
        </h3>

        <!-- 放置/目標區 (Drop Area) -->
        <div id="drop-target" class="w-36 h-36 sm:w-44 sm:h-44 border-4 border-dashed border-amber-400 rounded-3xl bg-amber-50 mx-auto flex items-center justify-center transition-all">
          <span id="target-placeholder" class="text-slate-400 text-2xl font-bold">拖到這裡</span>
          <span id="target-text" class="text-5xl sm:text-7xl font-black text-amber-600 hidden"></span>
        </div>
      </div>

      <!-- 反饋訊息 -->
      <div id="feedback-msg" class="h-10 text-xl font-bold mb-4 text-center transition-opacity opacity-0"></div>

      <!-- 可選卡片/答案選項 (Draggable / Clickable Options) -->
      <div id="options-container" class="flex flex-wrap justify-center gap-4 sm:gap-6 w-full">
        <!-- 選項卡片由 JS 動態生成 -->
      </div>
    </div>

    <!-- 3. 通關獎勵畫面 -->
    <div id="view-reward" class="hidden text-center bg-white p-8 sm:p-12 rounded-3xl shadow-2xl border-4 border-yellow-300 max-w-lg w-full">
      <div class="text-6xl mb-4 animate-bounce-short">🎉 ⭐ 🏆</div>
      <h2 class="text-3xl sm:text-4xl font-extrabold text-amber-600 mb-4">太棒了！全對！</h2>
      <p class="text-slate-600 text-xl mb-8">你完成了這個關卡！</p>
      <button onclick="showMainMenu()" class="bg-green-500 hover:bg-green-600 text-white font-black text-2xl py-4 px-10 rounded-full shadow-lg transform transition active:scale-95">
        再玩一次 🔄
      </button>
    </div>

  </main>

  <!-- 頁腳 -->
  <footer class="text-center p-4 text-slate-400 text-sm">
    專為 5 歲幼兒設計的互動學習平台
  </footer>

  <script>
    /* 
      ================================================================
      【內容設定與簡易編輯 (JSON Configuration)】
      在此可輕鬆編輯、替換或新增遊戲關卡與題庫資料。
      ================================================================
    */
    const QUIZ_CONFIG = [
      {
        id: "level-1",
        title: "數字大挑戰 1-5",
        icon: "🔢",
        questions: [
          { question: "哪個是數字 1？", answer: "1", options: ["1", "2", "3"] },
          { question: "哪個是數字 3？", answer: "3", options: ["2", "3", "4"] },
          { question: "哪個是數字 5？", answer: "5", options: ["3", "4", "5"] },
          { question: "哪個是數字 2？", answer: "2", options: ["1", "2", "5"] }
        ]
      },
      {
        id: "level-2",
        title: "認識基本形狀",
        icon: "⭐",
        questions: [
          { question: "請選出「圓形」", answer: "圓形", options: ["圓形", "方形", "三角形"] },
          { question: "請選出「三角形」", answer: "三角形", options: ["星形", "三角形", "圓形"] },
          { question: "請選出「方形」", answer: "方形", options: ["方形", "圓形", "心形"] }
        ]
      },
      {
        id: "level-3",
        title: "基礎顏色辨識",
        icon: "🎨",
        questions: [
          { question: "請點擊「紅色」", answer: "紅色", options: ["紅色", "藍色", "黃色"] },
          { question: "請點擊「黃色」", answer: "黃色", options: ["綠色", "黃色", "紅色"] },
          { question: "請點擊「綠色」", answer: "綠色", options: ["藍色", "紫色", "綠色"] }
        ]
      },
      {
        id: "level-4",
        title: "動物世界",
        icon: "🐱",
        questions: [
          { question: "誰會「喵喵」叫？", answer: "小貓", options: ["小狗", "小貓", "小鳥"] },
          { question: "誰會「汪汪」叫？", answer: "小狗", options: ["小狗", "小鴨", "小豬"] },
          { question: "誰在水裡游泳？", answer: "小魚", options: ["小兔", "小魚", "小雞"] }
        ]
      },
      {
        id: "level-5",
        title: "簡單加減法",
        icon: "➕",
        questions: [
          { question: "1 + 1 = ?", answer: "2", options: ["1", "2", "3"] },
          { question: "2 + 1 = ?", answer: "3", options: ["2", "3", "4"] },
          { question: "3 - 1 = ?", answer: "2", options: ["1", "2", "4"] }
        ]
      }
    ];

    /* 
      ================================================================
      【遊戲核心邏輯 (Vanilla JS)】
      ================================================================
    */
    let currentLevelIndex = 0;
    let currentQuestionIndex = 0;
    let activeQuestions = [];
    let draggedAnswer = null;

    // 頁面初始化
    document.addEventListener("DOMContentLoaded", () => {
      renderMenu();
      setupDropTarget();
    });

    // 顯示首頁選單
    function showMainMenu() {
      document.getElementById("view-menu").classList.remove("hidden");
      document.getElementById("view-game").classList.add("hidden");
      document.getElementById("view-reward").classList.add("hidden");
      document.getElementById("btn-home").classList.add("hidden");
      document.getElementById("app-title").textContent = "🌟 幼兒趣味學習樂園 🌟";
    }

    // 渲染關卡選單
    function renderMenu() {
      const grid = document.getElementById("game-grid");
      grid.innerHTML = "";

      QUIZ_CONFIG.forEach((level, index) => {
        const card = document.createElement("button");
        card.className = "bg-white p-6 rounded-3xl shadow-lg border-4 border-amber-200 hover:border-amber-400 flex flex-col items-center justify-center transform transition active:scale-95";
        card.onclick = () => startLevel(index);

        card.innerHTML = `
          <span class="text-6xl mb-3">${level.icon}</span>
          <span class="text-2xl font-black text-slate-800">${level.title}</span>
          <span class="text-sm font-bold text-slate-400 mt-2">${level.questions.length} 題測驗</span>
        `;
        grid.appendChild(card);
      });
    }

    // 開始關卡
    function startLevel(index) {
      currentLevelIndex = index;
      const levelData = QUIZ_CONFIG[index];
      // 複製並洗牌題目陣列
      activeQuestions = [...levelData.questions].sort(() => Math.random() - 0.5);
      currentQuestionIndex = 0;

      document.getElementById("view-menu").classList.add("hidden");
      document.getElementById("view-game").classList.remove("hidden");
      document.getElementById("view-reward").classList.add("hidden");
      document.getElementById("btn-home").classList.remove("hidden");
      document.getElementById("game-title").textContent = levelData.title;

      loadQuestion();
    }

    // 載入當前題目
    function loadQuestion() {
      const total = activeQuestions.length;
      const current = activeQuestions[currentQuestionIndex];

      // 重置放置區與訊息
      resetDropZone();
      showFeedback("", "");

      // 更新進度與題目
      document.getElementById("game-progress").textContent = `${currentQuestionIndex + 1} / ${total}`;
      document.getElementById("question-text").textContent = current.question;

      // 生成選項卡片 (純數字或純文字，無多餘提示標籤)
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      // 打亂選項順序
      const shuffledOptions = [...current.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement("div");
        btn.className = "draggable bg-white border-4 border-amber-300 rounded-2xl shadow-md p-4 sm:p-6 text-3xl sm:text-5xl font-black text-slate-800 flex items-center justify-center min-w-[100px] min-h-[100px] active:scale-95 transition-transform";
        btn.setAttribute("draggable", "true");
        btn.textContent = opt;

        // 點擊事件 (適合觸控/單擊操作)
        btn.onclick = () => checkAnswer(opt);

        // 拖拽事件 (Drag & Drop)
        btn.addEventListener("dragstart", (e) => {
          draggedAnswer = opt;
          e.dataTransfer.setData("text/plain", opt);
        });

        optionsContainer.appendChild(btn);
      });
    }

    // 設定放置目標區 (Drop Target)
    function setupDropTarget() {
      const target = document.getElementById("drop-target");

      target.addEventListener("dragover", (e) => {
        e.preventDefault();
        target.classList.add("dropzone-highlight");
      });

      target.addEventListener("dragleave", () => {
        target.classList.remove("dropzone-highlight");
      });

      target.addEventListener("drop", (e) => {
        e.preventDefault();
        target.classList.remove("dropzone-highlight");
        const val = e.dataTransfer.getData("text/plain") || draggedAnswer;
        if (val) {
          checkAnswer(val);
        }
      });
    }

    // 檢查答案
    function checkAnswer(selectedOption) {
      const current = activeQuestions[currentQuestionIndex];
      const isCorrect = (selectedOption === current.answer);

      // 更新放置區顯示純文字/數字
      const placeholder = document.getElementById("target-placeholder");
      const targetText = document.getElementById("target-text");
      placeholder.classList.add("hidden");
      targetText.classList.remove("hidden");
      targetText.textContent = selectedOption;

      if (isCorrect) {
        showFeedback("太棒了！答對了！ ✨", "text-green-600");
        
        // 延遲後進入下一題或結算
        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < activeQuestions.length) {
            loadQuestion();
          } else {
            showRewardScreen();
          }
        }, 1200);
      } else {
        showFeedback("再試一次看看喔！ 💪", "text-amber-600");
        
        // 答錯時重置放置區，並將該題移至隊尾重新抽問
        const missedQuestion = activeQuestions.splice(currentQuestionIndex, 1)[0];
        activeQuestions.push(missedQuestion);

        setTimeout(() => {
          loadQuestion();
        }, 1200);
      }
    }

    // 重置放置區
    function resetDropZone() {
      const placeholder = document.getElementById("target-placeholder");
      const targetText = document.getElementById("target-text");
      placeholder.classList.remove("hidden");
      targetText.classList.add("hidden");
      targetText.textContent = "";
    }

    // 顯示反饋文字
    function showFeedback(msg, colorClass) {
      const el = document.getElementById("feedback-msg");
      el.textContent = msg;
      el.className = `h-10 text-xl sm:text-2xl font-bold mb-4 text-center transition-opacity duration-300 ${colorClass}`;
      el.style.opacity = msg ? "1" : "0";
    }

    // 顯示過關獎勵
    function showRewardScreen() {
      document.getElementById("view-game").classList.add("hidden");
      document.getElementById("view-reward").classList.remove("hidden");

      // 觸發五彩紙屑特效 (Canvas Confetti)
      if (typeof confetti === "function") {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }
  </script>
</body>
</html>
