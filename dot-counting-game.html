<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數數點點仔 - 幼兒數感練習平台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.94);
    }
    .drop-zone {
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .drop-zone.drag-over {
      background-color: #fef08a;
      border-color: #f59e0b;
    }
    /* 圓點卡片內部 5 個一排排版 */
    .dot-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      justify-items: center;
      align-items: center;
    }
    .dot-circle {
      width: 24px;
      height: 24px;
      background-color: #0284c7; /* 經典深藍色圓點 */
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    @media (min-width: 768px) {
      .dot-circle {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="bg-sky-400 p-4 shadow-md flex justify-between items-center">
    <button id="homeBtn" onclick="showMainMenu()" class="bg-white text-sky-900 text-lg md:text-xl font-bold px-4 py-2 rounded-2xl shadow hover:bg-sky-100 btn-bounce flex items-center gap-2 hidden">
      🏠 首頁
    </button>
    <h1 id="headerTitle" class="text-2xl md:text-3xl font-black text-sky-950 mx-auto">數數點點仔</h1>
  </header>

  <!-- 主要內容區 -->
  <main class="container mx-auto px-4 py-6 flex-grow flex flex-col justify-center items-center">

    <!-- 1. 首頁選單 -->
    <div id="mainMenu" class="w-full max-w-4xl space-y-6">
      <div class="text-center mb-8">
        <h2 class="text-3xl md:text-4xl font-black text-sky-900 mb-2">請選擇關卡</h2>
        <p class="text-sky-800 text-lg font-bold">一起來數一數有多少個點點仔！</p>
      </div>
      <div id="levelGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 關卡卡片由 JS 動態生成 -->
      </div>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="gameArea" class="w-full max-w-3xl hidden flex-col items-center space-y-6">
      <!-- 關卡名稱與進度條 -->
      <div class="w-full flex justify-between items-center px-4">
        <span id="levelDisplayTitle" class="text-xl font-extrabold text-sky-900">關卡</span>
        <span id="progressText" class="text-xl font-black text-sky-700">第 1 / 15 題</span>
      </div>
      <div class="w-full bg-sky-200 h-5 rounded-full overflow-hidden p-1 shadow-inner">
        <div id="progressBar" class="bg-sky-500 h-full w-0 rounded-full transition-all duration-300"></div>
      </div>

      <!-- 題目顯示區 -->
      <div class="flex flex-col items-center justify-center gap-6 w-full my-4">
        <!-- 點點仔/數字題目顯示卡片 -->
        <div id="questionCard" class="bg-white border-4 border-sky-300 rounded-3xl p-6 md:p-8 min-w-[280px] min-h-[160px] flex items-center justify-center shadow-lg">
          <!-- 內容由 JS 動態生成 -->
        </div>

        <!-- 放置答案目標區 (Drop Zone) -->
        <div class="flex items-center gap-3">
          <span class="text-xl font-extrabold text-sky-900">數量是：</span>
          <div id="answerBox" class="drop-zone border-4 border-dashed border-sky-400 bg-sky-100 rounded-3xl w-24 h-24 md:w-28 md:h-28 flex items-center justify-center text-4xl md:text-5xl font-black text-sky-900 shadow-inner">
            ?
          </div>
        </div>
      </div>

      <!-- 答案選項卡片區 -->
      <div class="w-full mt-2">
        <p class="text-center text-sky-800 font-bold mb-4 text-lg">點擊或將正確數字拖拽到框框：</p>
        <div id="optionsContainer" class="flex flex-wrap justify-center gap-4">
          <!-- 選項按鈕由 JS 動態生成 -->
        </div>
      </div>
    </div>

    <!-- 3. 結算/獎勵 Modal -->
    <div id="rewardModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl transform transition-all">
        <div class="text-8xl animate-bounce">🏆</div>
        <h3 id="rewardTitle" class="text-3xl font-black text-sky-600">數數小專家！</h3>
        <p id="rewardDesc" class="text-slate-600 text-lg font-bold">你太棒了！順利完成了所有題目！</p>
        <div class="flex flex-col gap-3">
          <button onclick="showMainMenu()" class="bg-sky-400 text-sky-950 font-bold text-xl py-4 rounded-2xl shadow-lg hover:bg-sky-500 btn-bounce">
            再玩一次 / 回首頁
          </button>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-sky-800 text-sm font-bold">
    數數點點仔 幼兒數感互動練習平台
  </footer>

  <!-- JS 邏輯區 -->
  <script>
    /* ==========================================================================
       【頂層 JSON 設定檔】
       ========================================================================== */
    const GAME_CONFIG = {
      levels: [
        {
          id: 1,
          title: "Level 1: 數數點點仔基礎大挑戰",
          desc: "15題綜合練習 (點點仔 1-15 & 數字 1-5)",
          color: "bg-sky-400 hover:bg-sky-500 text-white",
          type: "level1"
        }
      ]
    };

    /* ==========================================================================
       核心邏輯 (Vanilla JS)
       ========================================================================== */
    let currentLevel = null;
    let currentQuestionIndex = 0;
    let questionsList = [];
    let currentQuestion = null;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 初始化選單
    function initMenu() {
      const grid = document.getElementById("levelGrid");
      grid.innerHTML = "";
      GAME_CONFIG.levels.forEach(lvl => {
        const card = document.createElement("div");
        card.className = `${lvl.color} p-6 rounded-3xl shadow-xl cursor-pointer btn-bounce flex flex-col justify-between h-48`;
        card.onclick = () => startLevel(lvl);
        card.innerHTML = `
          <h3 class="text-2xl font-black">${lvl.title}</h3>
          <p class="text-lg opacity-90">${lvl.desc}</p>
          <div class="self-end bg-white/20 px-4 py-1.5 rounded-full text-sm font-black">開始關卡 ➔</div>
        `;
        grid.appendChild(card);
      });
    }

    function showMainMenu() {
      document.getElementById("mainMenu").classList.remove("hidden");
      document.getElementById("gameArea").classList.add("hidden");
      document.getElementById("homeBtn").classList.add("hidden");
      document.getElementById("rewardModal").classList.add("hidden");
      document.getElementById("headerTitle").innerText = "數數點點仔";
    }

    // 動態題目生成器 (嚴格遵循 Q1-5, Q6-10, Q11-13, Q14-15 規則)
    function generateQuestions() {
      let list = [];

      // Q1 - Q5: 圓點圖案 (範圍 1 - 5)
      for (let i = 0; i < 5; i++) {
        let count = getRandomInt(1, 5);
        list.push({ displayType: "dots", value: count, ans: count });
      }

      // Q6 - Q10: 數字 (範圍 1 - 5)
      for (let i = 0; i < 5; i++) {
        let count = getRandomInt(1, 5);
        list.push({ displayType: "number", value: count, ans: count });
      }

      // Q11 - Q13: 圓點圖案 (範圍 6 - 10，每 5 個一排)
      for (let i = 0; i < 3; i++) {
        let count = getRandomInt(6, 10);
        list.push({ displayType: "dots", value: count, ans: count });
      }

      // Q14 - Q15: 圓點圖案 (範圍 10 - 15，每 5 個一排)
      for (let i = 0; i < 2; i++) {
        let count = getRandomInt(10, 15);
        list.push({ displayType: "dots", value: count, ans: count });
      }

      return list;
    }

    function startLevel(level) {
      currentLevel = level;
      currentQuestionIndex = 0;
      questionsList = generateQuestions();

      document.getElementById("mainMenu").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
      document.getElementById("gameArea").classList.add("flex");
      document.getElementById("homeBtn").classList.remove("hidden");
      document.getElementById("headerTitle").innerText = level.title;
      document.getElementById("levelDisplayTitle").innerText = level.title;

      renderQuestion();
    }

    // 渲染圓點 (每 5 個一排)
    function createDotsHTML(count) {
      let dotsHTML = '';
      for (let i = 0; i < count; i++) {
        dotsHTML += `<div class="dot-circle"></div>`;
      }
      return `<div class="dot-grid">${dotsHTML}</div>`;
    }

    // 載入當前題目
    function renderQuestion() {
      currentQuestion = questionsList[currentQuestionIndex];

      // 更新進度條
      const total = questionsList.length;
      document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / ${total} 題`;
      document.getElementById("progressBar").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

      // 渲染題目區
      const qCard = document.getElementById("questionCard");
      if (currentQuestion.displayType === "dots") {
        qCard.innerHTML = createDotsHTML(currentQuestion.value);
      } else {
        qCard.innerHTML = `<span class="text-6xl md:text-7xl font-black text-sky-600">${currentQuestion.value}</span>`;
      }

      // 重置答案放置區
      const answerBox = document.getElementById("answerBox");
      answerBox.innerText = "?";
      answerBox.classList.remove("bg-emerald-200", "border-emerald-500", "text-emerald-800");

      // 生成答案選項卡片 (以正解為基準隨機干擾)
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      let options = [currentQuestion.ans];
      while (options.length < 4) {
        let rand = getRandomInt(1, 15);
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort((a, b) => a - b); // 由小到大排列

      options.forEach(num => {
        const btn = document.createElement("div");
        btn.className = "bg-sky-400 border-b-4 border-sky-600 text-sky-950 font-black text-3xl md:text-4xl w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg btn-bounce select-none";
        btn.innerText = num;
        btn.setAttribute("draggable", "true");

        btn.onclick = () => checkAnswer(num);

        btn.ondragstart = (e) => {
          e.dataTransfer.setData("text/plain", num.toString());
        };

        optionsContainer.appendChild(btn);
      });

      // Drag and Drop 放置設定
      answerBox.ondragover = (e) => {
        e.preventDefault();
        answerBox.classList.add("drag-over");
      };
      answerBox.ondragleave = () => {
        answerBox.classList.remove("drag-over");
      };
      answerBox.ondrop = (e) => {
        e.preventDefault();
        answerBox.classList.remove("drag-over");
        const val = e.dataTransfer.getData("text/plain");
        if (val) checkAnswer(parseInt(val, 10));
      };
    }

    // 檢查答案
    function checkAnswer(selectedVal) {
      if (selectedVal === currentQuestion.ans) {
        const answerBox = document.getElementById("answerBox");
        answerBox.innerText = selectedVal;
        answerBox.classList.add("bg-emerald-200", "border-emerald-500", "text-emerald-800");

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questionsList.length) {
            renderQuestion();
          } else {
            showLevelReward();
          }
        }, 1000);
      } else {
        // 答錯溫和重試
        questionsList.push(currentQuestion);
        
        const answerBox = document.getElementById("answerBox");
        answerBox.innerText = selectedVal;
        answerBox.classList.add("bg-rose-200", "border-rose-500", "text-rose-800");
        setTimeout(() => {
          answerBox.innerText = "?";
          answerBox.classList.remove("bg-rose-200", "border-rose-500", "text-rose-800");
        }, 800);
      }
    }

    // 獎勵通關
    function showLevelReward() {
      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });

      const modal = document.getElementById("rewardModal");
      document.getElementById("rewardTitle").innerText = "🏆 數數小專家！";
      document.getElementById("rewardDesc").innerText = `太棒了！你順利完成了全部 15 道題目！`;
      modal.classList.remove("hidden");
    }

    window.onload = () => {
      initMenu();
    };
  </script>
</body>
</html>
