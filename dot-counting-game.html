<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數數點點仔 - 幼兒數感練習平台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.94);
    }
    .drop-zone {
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .drop-zone.drag-over {
      background-color: #fef08a;
      border-color: #f59e0b;
    }
    /* 圓點排版：每 5 個一排 */
    .dot-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      justify-items: center;
      align-items: center;
      padding: 4px;
    }
    .dot-circle {
      width: 20px;
      height: 20px;
      background-color: #0284c7;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    }
    @media (min-width: 768px) {
      .dot-circle {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>
<body class="bg-sky-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="bg-sky-400 p-4 shadow-md flex justify-between items-center">
    <button id="homeBtn" onclick="showMainMenu()" class="bg-white text-sky-900 text-lg md:text-xl font-bold px-4 py-2 rounded-2xl shadow hover:bg-sky-100 btn-bounce flex items-center gap-2 hidden">
      🏠 首頁
    </button>
    <h1 id="headerTitle" class="text-2xl md:text-3xl font-black text-sky-950 mx-auto">數數點點仔</h1>
  </header>

  <!-- 主要內容區 -->
  <main class="container mx-auto px-4 py-6 flex-grow flex flex-col justify-center items-center">

    <!-- 1. 首頁關卡選單 -->
    <div id="mainMenu" class="w-full max-w-4xl space-y-6">
      <div class="text-center mb-8">
        <h2 class="text-3xl md:text-4xl font-black text-sky-900 mb-2">請選擇關卡</h2>
        <p class="text-sky-800 text-lg font-bold">觀察圖案與數字，挑戰 30 道數數與加減法題目！</p>
      </div>
      <div id="levelGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="gameArea" class="w-full max-w-4xl hidden flex-col items-center space-y-6">
      <!-- 關卡標題與進度條 -->
      <div class="w-full flex justify-between items-center px-4">
        <span id="levelDisplayTitle" class="text-xl font-extrabold text-sky-900">關卡</span>
        <span id="progressText" class="text-xl font-black text-sky-700">第 1 / 30 題</span>
      </div>
      <div class="w-full bg-sky-200 h-5 rounded-full overflow-hidden p-1 shadow-inner">
        <div id="progressBar" class="bg-sky-500 h-full w-0 rounded-full transition-all duration-300"></div>
      </div>

      <!-- 題目顯示區 -->
      <div class="w-full bg-white p-6 rounded-3xl border-4 border-sky-300 shadow-lg flex flex-col items-center gap-6">
        <!-- 上方：題目表達式卡片 -->
        <div id="questionContainer" class="flex flex-wrap items-center justify-center gap-3 md:gap-6 w-full"></div>

        <!-- 下方：答案放置目標框 (分離設計，確保位置固定不重疊) -->
        <div class="flex items-center gap-3 border-t-2 border-sky-100 pt-4 w-full justify-center">
          <span class="text-2xl font-black text-sky-900">答案是：</span>
          <div id="answerBox" class="drop-zone border-4 border-dashed border-sky-400 bg-sky-50 rounded-2xl w-24 h-24 md:w-28 md:h-28 flex items-center justify-center text-4xl md:text-5xl font-black text-sky-900 shadow-inner">
            ?
          </div>
        </div>
      </div>

      <!-- 選項卡片區 -->
      <div class="w-full">
        <p class="text-center text-sky-800 font-bold mb-3 text-lg">點擊或將正確答案拖到「?」框內：</p>
        <div id="optionsContainer" class="flex flex-wrap justify-center gap-4"></div>
      </div>
    </div>

    <!-- 3. 獎勵 Modal -->
    <div id="rewardModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-6 shadow-2xl">
        <div class="text-8xl animate-bounce">🏆</div>
        <h3 id="rewardTitle" class="text-3xl font-black text-sky-600">數數小專家！</h3>
        <p id="rewardDesc" class="text-slate-600 text-lg font-bold">太棒了！你順利完成了所有 30 道題目！</p>
        <button onclick="showMainMenu()" class="w-full bg-sky-400 text-sky-950 font-bold text-xl py-4 rounded-2xl shadow-lg hover:bg-sky-500 btn-bounce">
          再玩一次 / 回首頁
        </button>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-sky-800 text-sm font-bold">
    數數點點仔 幼兒數感練習平台
  </footer>

  <script>
    /* ==========================================================================
       【頂層 JSON 設定檔】 (無程式背景者可在此輕易調整關卡資訊)
       ========================================================================== */
    const GAME_CONFIG = {
      levels: [
        {
          id: 1,
          mode: "add",
          title: "Level 1: 點點加法全能挑戰",
          desc: "共 30 題 (Q1-10 加法 | Q11-15 點數選數 | Q16-20 加法 | Q21-25 點數選數 | Q26-30 加法)",
          color: "bg-sky-400 hover:bg-sky-500 text-white"
        },
        {
          id: 2,
          mode: "sub",
          title: "Level 2: 點點減法全能挑戰",
          desc: "共 30 題 (Q1-10 減法 | Q11-15 點數選數 | Q16-20 減法 | Q21-25 點數選數 | Q26-30 減法)",
          color: "bg-emerald-500 hover:bg-emerald-600 text-white"
        }
      ]
    };

    let currentLevel = null;
    let currentQuestionIndex = 0;
    let questionsList = [];
    let currentQuestion = null;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function initMenu() {
      const grid = document.getElementById("levelGrid");
      grid.innerHTML = "";
      GAME_CONFIG.levels.forEach(lvl => {
        const card = document.createElement("div");
        card.className = `${lvl.color} p-6 rounded-3xl shadow-xl cursor-pointer btn-bounce flex flex-col justify-between h-48`;
        card.onclick = () => startLevel(lvl);
        card.innerHTML = `
          <h3 class="text-2xl font-black">${lvl.title}</h3>
          <p class="text-lg opacity-90">${lvl.desc}</p>
          <div class="self-end bg-white/20 px-4 py-1.5 rounded-full text-sm font-black">開始遊戲 ➔</div>
        `;
        grid.appendChild(card);
      });
    }

    function showMainMenu() {
      document.getElementById("mainMenu").classList.remove("hidden");
      document.getElementById("gameArea").classList.add("hidden");
      document.getElementById("homeBtn").classList.add("hidden");
      document.getElementById("rewardModal").classList.add("hidden");
      document.getElementById("headerTitle").innerText = "數數點點仔";
    }

    // 動態生成 30 題完整結構
    function generateQuestions(mode) {
      let list = [];

      function makeAddPair(minSum, maxSum) {
        let sum = getRandomInt(minSum, maxSum);
        let v1 = getRandomInt(1, sum - 1 || 1);
        let v2 = sum - v1;
        return { v1, v2, ans: sum };
      }

      function makeSubPair(minRange, maxRange) {
        let v1 = getRandomInt(minRange, maxRange);
        let v2 = getRandomInt(1, v1);
        return { v1, v2, ans: v1 - v2 };
      }

      const maker = (mode === "add") ? makeAddPair : makeSubPair;
      const opSymbol = mode === "add" ? "+" : "-";

      // Q1–Q5：點點算術 (1 ~ 5 點)
      for (let i = 0; i < 5; i++) {
        let p = maker(2, 5);
        list.push({ isCountOnly: false, displayType: "dots", val1: p.v1, val2: p.v2, ans: p.ans, op: opSymbol });
      }

      // Q6–Q10：數字辨識與算術 (1 ~ 5 數字)
      for (let i = 0; i < 5; i++) {
        let p = maker(2, 5);
        list.push({ isCountOnly: false, displayType: "number", val1: p.v1, val2: p.v2, ans: p.ans, op: opSymbol });
      }

      // Q11–Q15：點點圖案數數 (6 ~ 10 點，不需算術，選正確數字)
      for (let i = 0; i < 5; i++) {
        let val = getRandomInt(6, 10);
        list.push({ isCountOnly: true, displayType: "dots", val1: val, ans: val });
      }

      // Q16–Q20：點點圖案算術 (6 ~ 10 點，每 5 點一排)
      for (let i = 0; i < 5; i++) {
        let p = maker(6, 10);
        list.push({ isCountOnly: false, displayType: "dots", val1: p.v1, val2: p.v2, ans: p.ans, op: opSymbol });
      }

      // Q21–Q25：點點圖案數數 (10 ~ 15 點，不需算術，選正確數字)
      for (let i = 0; i < 5; i++) {
        let val = getRandomInt(10, 15);
        list.push({ isCountOnly: true, displayType: "dots", val1: val, ans: val });
      }

      // Q26–Q30：點點圖案算術 (6 ~ 10 點，每 5 點一排)
      for (let i = 0; i < 5; i++) {
        let p = maker(6, 10);
        list.push({ isCountOnly: false, displayType: "dots", val1: p.v1, val2: p.v2, ans: p.ans, op: opSymbol });
      }

      return list;
    }

    function startLevel(level) {
      currentLevel = level;
      currentQuestionIndex = 0;
      questionsList = generateQuestions(level.mode);

      document.getElementById("mainMenu").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
      document.getElementById("gameArea").classList.add("flex");
      document.getElementById("homeBtn").classList.remove("hidden");
      document.getElementById("headerTitle").innerText = level.title;
      document.getElementById("levelDisplayTitle").innerText = level.title;

      renderQuestion();
    }

    function createDotsHTML(count) {
      let dotsHTML = '';
      for (let i = 0; i < count; i++) {
        dotsHTML += `<div class="dot-circle"></div>`;
      }
      return `<div class="dot-grid">${dotsHTML}</div>`;
    }

    function renderQuestion() {
      currentQuestion = questionsList[currentQuestionIndex];

      // 進度條更新
      const total = questionsList.length;
      document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / ${total} 題`;
      document.getElementById("progressBar").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

      // 渲染題目區內容
      const qContainer = document.getElementById("questionContainer");
      qContainer.innerHTML = "";

      if (currentQuestion.isCountOnly) {
        // 單純數數題
        const card = document.createElement("div");
        card.className = "bg-sky-100 border-2 border-sky-300 rounded-2xl p-4 min-w-[120px] min-h-[100px] flex items-center justify-center";
        card.innerHTML = createDotsHTML(currentQuestion.val1);
        qContainer.appendChild(card);
      } else {
        // 算術題 (加法/減法)
        const n1Card = document.createElement("div");
        n1Card.className = "bg-sky-100 border-2 border-sky-300 rounded-2xl p-4 min-w-[90px] min-h-[90px] flex items-center justify-center";
        n1Card.innerHTML = currentQuestion.displayType === "dots" ? createDotsHTML(currentQuestion.val1) : `<span class="text-5xl font-black text-sky-600">${currentQuestion.val1}</span>`;

        const opCard = document.createElement("span");
        opCard.className = "text-4xl md:text-6xl font-black text-sky-600";
        opCard.innerText = currentQuestion.op;

        const n2Card = document.createElement("div");
        n2Card.className = "bg-sky-100 border-2 border-sky-300 rounded-2xl p-4 min-w-[90px] min-h-[90px] flex items-center justify-center";
        n2Card.innerHTML = currentQuestion.displayType === "dots" ? createDotsHTML(currentQuestion.val2) : `<span class="text-5xl font-black text-sky-600">${currentQuestion.val2}</span>`;

        const eqCard = document.createElement("span");
        eqCard.className = "text-4xl md:text-6xl font-black text-sky-600";
        eqCard.innerText = "=";

        qContainer.appendChild(n1Card);
        qContainer.appendChild(opCard);
        qContainer.appendChild(n2Card);
        qContainer.appendChild(eqCard);
      }

      // 重置答案框
      const answerBox = document.getElementById("answerBox");
      answerBox.innerText = "?";
      answerBox.className = "drop-zone border-4 border-dashed border-sky-400 bg-sky-50 rounded-2xl w-24 h-24 md:w-28 md:h-28 flex items-center justify-center text-4xl md:text-5xl font-black text-sky-900 shadow-inner";

      // 生成選項並打散，確保正解位置變換
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      let options = [currentQuestion.ans];
      while (options.length < 4) {
        let rand = getRandomInt(0, 15);
        if (!options.includes(rand)) options.push(rand);
      }
      
      // 隨機洗牌選項 (確保正確答案位置隨機改變)
      options.sort(() => Math.random() - 0.5);

      options.forEach(num => {
        const btn = document.createElement("div");
        btn.className = "bg-sky-400 border-b-4 border-sky-600 text-sky-950 font-black text-3xl md:text-4xl w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg btn-bounce select-none";
        btn.innerText = num;
        btn.setAttribute("draggable", "true");

        btn.onclick = () => checkAnswer(num);
        btn.ondragstart = (e) => e.dataTransfer.setData("text/plain", num.toString());

        optionsContainer.appendChild(btn);
      });

      // Drag and Drop 綁定
      answerBox.ondragover = (e) => { e.preventDefault(); answerBox.classList.add("drag-over"); };
      answerBox.ondragleave = () => answerBox.classList.remove("drag-over");
      answerBox.ondrop = (e) => {
        e.preventDefault();
        answerBox.classList.remove("drag-over");
        const val = e.dataTransfer.getData("text/plain");
        if (val !== null && val !== "") checkAnswer(parseInt(val, 10));
      };
    }

    function checkAnswer(selectedVal) {
      const answerBox = document.getElementById("answerBox");
      if (selectedVal === currentQuestion.ans) {
        answerBox.innerText = selectedVal;
        answerBox.classList.add("bg-emerald-200", "border-emerald-500", "text-emerald-800");

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questionsList.length) {
            renderQuestion();
          } else {
            showLevelReward();
          }
        }, 1000);
      } else {
        // 答錯溫和重試機制 (將錯題移至隊尾重新隨機問答)
        questionsList.push(currentQuestion);
        answerBox.innerText = selectedVal;
        answerBox.classList.add("bg-rose-200", "border-rose-500", "text-rose-800");

        setTimeout(() => {
          answerBox.innerText = "?";
          answerBox.classList.remove("bg-rose-200", "border-rose-500", "text-rose-800");
        }, 800);
      }
    }

    function showLevelReward() {
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
      document.getElementById("rewardModal").classList.remove("hidden");
    }

    window.onload = initMenu;
  </script>
</body>
</html>
